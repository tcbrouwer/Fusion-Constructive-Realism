[package]
name = "fcr_engine"
version = "2.1.0"
edition = "2021"
authors = ["FCR Theoretical Physics Working Group"]
description = "Foundational State-Space & Reduction Engine for Fusion Constructive Realism (FCR v2.1)"

[dependencies]
num-complex = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rayon = "1.10"
sha2 = "0.10"
petgraph = "0.6"
clap = { version = "4.4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[[bin]]
name = "fcr_engine"
path = "src/main.rs"

[lib]
name = "fcr_core"
path = "src/lib.rs"
